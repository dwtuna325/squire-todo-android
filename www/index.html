<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="color-scheme" content="dark">
<title>Squire 할 일</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- 상단 탭 -->
<nav class="tabs">
  <button class="tab active" data-screen="todo" type="button">📝 할 일</button>
  <button class="tab" data-screen="settings" type="button">⚙️ 설정</button>
</nav>

<!-- ─────────────── 할 일 화면 ─────────────── -->
<section id="screen-todo" class="screen active">
  <div class="wrap">
    <h1>📝 To Do</h1>
    <p class="sub">업무·개인 할 일을 한곳에서. 집·회사 PC와 구글 드라이브로 동기화됩니다.</p>

    <div id="update-banner" class="msg" hidden></div>
    <div id="sync-result" class="msg" hidden></div>

    <div class="synced">
      <span id="sync-line">☁️ 동기화: 아직 연결 안 됨 (설정에서 연결)</span>
      <button class="btn" id="btn-sync-now" type="button" hidden>🔄 지금 동기화</button>
    </div>

    <form class="add" id="add-form" autocomplete="off">
      <input type="text" name="text" placeholder="새 할 일을 입력…" required>
      <select name="tag" id="add-tag"></select>
      <input type="date" name="due" id="add-due" min="2000-01-01" max="9999-12-31" title="마감일">
      <label class="recur-opt" title="매주 지정 요일마다 다시 뜨는 고정 업무">
        <input type="checkbox" id="recur-weekly">🔁 주간</label>
      <label class="recur-opt" title="매월 지정 일자마다 다시 뜨는 고정 업무">
        <input type="checkbox" id="recur-monthly">🔁 월간</label>
      <button class="btn" type="submit">추가</button>
      <div class="recur-detail" id="rd-weekly">
        <span class="rd-label">반복 요일</span>
        <span id="weekday-boxes"></span>
      </div>
      <div class="recur-detail" id="rd-monthly">
        <span class="rd-label">매월</span>
        <input class="dom-input" type="number" id="add-dom" min="1" max="31" placeholder="일자">
        <span class="rd-label">일에 다시 뜸</span>
      </div>
      <textarea class="add-note" name="note" rows="2" placeholder="메모(선택) — 추가 후 제목을 눌러 다시 편집할 수 있어요"></textarea>
    </form>

    <ul class="todo" id="todo-list"></ul>
    <div class="empty" id="empty-msg" hidden>아직 할 일이 없습니다. 위에서 첫 할 일을 추가해 보세요.</div>

    <div class="archive-wrap" id="archive-wrap" hidden>
      <h2 class="archive-head">지난 내역 <span class="arch-sub">— 완료됨 · 완료월별</span></h2>
      <div id="archive-groups"></div>
    </div>
  </div>
</section>

<!-- ─────────────── 설정 화면 ─────────────── -->
<section id="screen-settings" class="screen">
  <div class="wrap">
    <h1>⚙️ 설정</h1>
    <p class="sub">알림과 동기화를 관리합니다.</p>
    <div id="settings-body">
      <div class="card"><p class="hint">설정 화면은 다음 단계(M3)에서 채워집니다.</p></div>
    </div>
  </div>
</section>

<!-- 동기화 진행중 모달 -->
<div class="modal-overlay" id="sync-overlay" hidden aria-hidden="true">
  <div class="modal-card" role="status" aria-live="polite">
    <div class="spinner"></div>
    <p class="modal-text">동기화 진행 중…</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/version.js"></script>
<script src="js/store.js"></script>
<script src="js/notifications.js"></script>
<script src="js/settings.js"></script>
<script src="js/gconfig.js"></script>
<script src="js/drive.js"></script>
<script src="js/app.js"></script>
<script src="js/update.js"></script>
</body>
</html>
